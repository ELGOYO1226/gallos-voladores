<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="icono-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icono-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gallos">
  <meta name="theme-color" content="#1b1035">
  <title>¡Gallos Voladores!</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1035; overflow: hidden; touch-action: none; }
    #juego { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="juego"></div>
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/juego.js"></script>
  <script>
    // en internet (https) se guarda para jugar sin conexión; en la PC de la casa no hace falta
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      // si ya había uno viejo y llega el nuevo, recarga una vez para jugar la versión nueva
      const habiaViejo = !!navigator.serviceWorker.controller;
      let recargado = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (habiaViejo && !recargado) { recargado = true; location.reload(); }
      });
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
    }
  </script>
</body>
</html>
